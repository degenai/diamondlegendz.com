<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blender JSON test viewer</title>
<style>html,body{margin:0;height:100%;background:#cfe3d6;overflow:hidden}#info{position:fixed;left:8px;top:6px;font:13px monospace;color:#003b1f}</style>
</head>
<body>
<div id="info">loading…</div>
<script type="module">
// Loader-free path: cmf-mesh-1 JSON (tools/blender/export_json.py) -> BufferGeometry. No GLTFLoader.
import * as THREE from '../vendor/three.module.js';

// ?a=chair|sedan|van|cart|person|goon   (&pose=1 swings limbs to prove the joint hierarchy)
const params = new URLSearchParams(location.search);
const name = (params.get('a') || 'chair').replace(/[^a-z0-9_-]/gi, '');
const pose = params.get('pose') === '1';
const info = document.getElementById('info');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3d6);
scene.fog = new THREE.Fog(0xcfe3d6, 12, 30);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a6b3a, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 6, 4);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0x7fae6a }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

function buildFromJson(data) {
  const nodes = {};
  const root = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
  for (const o of data.objects) {          // parents are emitted before children
    let node;
    if (o.indices.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(o.positions, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(o.normals, 3));
      g.setAttribute('color', new THREE.Float32BufferAttribute(o.colors, 3));
      g.setIndex(o.indices);
      node = new THREE.Mesh(g, mat);
    } else {
      node = new THREE.Group();
    }
    node.name = o.name;
    const t = o.parentTransform;
    node.position.fromArray(t.position);
    node.quaternion.fromArray(t.quaternion);
    node.scale.fromArray(t.scale);
    (o.parent ? nodes[o.parent] : root).add(node);
    nodes[o.name] = node;
  }
  return { root, nodes };
}

const res = await fetch(`./${name}.json`);
if (!res.ok) throw new Error(`${name}.json: HTTP ${res.status}`);
const data = await res.json();
const { root, nodes } = buildFromJson(data);
scene.add(root);

// prove the hierarchy is animatable: pose one arm and one knee (children must follow parents)
if (pose && nodes.UpperArm_R) { nodes.UpperArm_R.rotation.x = -1.1; nodes.LowerArm_R.rotation.x = -0.9; nodes.UpperLeg_L.rotation.x = 0.4; nodes.LowerLeg_L.rotation.x = -0.6; }
if (pose && nodes.upperArmR) { nodes.upperArmR.rotation.x = -1.1; nodes.lowerArmR.rotation.x = -0.9; nodes.upperLegL.rotation.x = -0.6; nodes.lowerLegL.rotation.x = 0.9; nodes.torso.rotation.y = 0.3; }
if (pose && nodes.Wheel_FL) { nodes.Wheel_FL.rotation.y = 0.4; nodes.Wheel_FR.rotation.y = 0.4; }

const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
const r = Math.max(size.x, size.y, size.z);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
camera.position.set(center.x + r * 1.3, center.y + r * 0.7, center.z + r * 1.6);
camera.lookAt(center);
info.textContent = `${name}.json · ${data.triangles} tris · ${data.objects.length} objects · ${(await (await fetch(`./${name}.json`)).text()).length} bytes`;
renderer.render(scene, camera);
document.title = 'rendered';
</script>
</body>
</html>
