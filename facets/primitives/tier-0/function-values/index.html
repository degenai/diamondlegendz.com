<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facet — Function Values</title>
<!--
facet:
  id: function-values
  tier: 0
  title: Function Values
  description: Per-target functions compute each bar's target value and delay.
  tags: [function, targets, stagger]
  apis: [animate]
  parents: []
-->
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0f; font-family: ui-monospace, monospace; color: #e8e8f0; }
body { display: grid; place-items: center; }
#stage { width: min(90vw, 600px); aspect-ratio: 1 / 1; display: grid; place-items: center; position: relative; }

#stage { display: flex; align-items: end; justify-content: center; gap: 12px; }
.bar { width: 24px; height: 96px; background: #7ef2c3; transform-origin: 50% 100%; }
</style>
</head>
<body>
<div id="stage">
  <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>
<script type="module">
import { animate } from '../../../vendor/anime.esm.min.js';

animate('.bar', {
  scaleY: (_el, i) => .45 + i * .22,
  y: (_el, i) => -i * 10,
  delay: (_el, i) => i * 85,
  duration: 900,
  loop: true,
  alternate: true,
  ease: 'inOut(2)',
});
</script>
</body>
</html>
