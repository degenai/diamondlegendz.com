<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facet — Utils Set</title>
<!--
facet:
  id: utils-set
  tier: 0
  title: Utils Set
  description: Instantly writes transforms with utils.set, no tweening.
  tags: [utils, set, instant]
  apis: [utils.set]
  parents: []
-->
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0f; font-family: ui-monospace, monospace; color: #e8e8f0; }
body { display: grid; place-items: center; }
#stage { width: min(90vw, 600px); aspect-ratio: 1 / 1; display: grid; place-items: center; position: relative; }

#stage { display: flex; align-items: center; justify-content: center; gap: 0; }
.box { width: 42px; height: 42px; background: #7ef2c3; position: absolute; }
.label { position: absolute; bottom: 48px; color: #6a6a85; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage">
  <div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
  <div class="label">instant write</div>
</div>
<script type="module">
import { utils } from '../../../vendor/anime.esm.min.js';

utils.set('.box', {
  x: (_el, i) => (i - 1.5) * 54,
  y: (_el, i) => i % 2 ? -26 : 26,
  rotate: (_el, i) => (i - 1.5) * 18,
  scale: (_el, i) => .75 + i * .18,
});
</script>
</body>
</html>
