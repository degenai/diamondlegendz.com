<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facet — SplitText Basic</title>
<!--
facet:
  id: splittext-basic
  tier: 0
  title: SplitText Basic
  description: Split one line into characters, then animate each character.
  tags: [text, split, stagger]
  apis: [splitText, animate, stagger]
  parents: []
-->
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0f; font-family: ui-monospace, monospace; color: #e8e8f0; }
body { display: grid; place-items: center; }
#stage { width: min(90vw, 600px); aspect-ratio: 1 / 1; display: grid; place-items: center; position: relative; }

.word { color: #e0f4ff; font-size: clamp(28px, 7vw, 64px); letter-spacing: .12em; font-weight: 700; }
</style>
</head>
<body>
<div id="stage"><div class="word">FACETS</div></div>
<script type="module">
import { animate, stagger, splitText } from '../../../vendor/anime.esm.min.js';

const { chars } = splitText('.word', { words: false, chars: true });

animate(chars, {
  y: ['1.2em', 0],
  opacity: [0, 1],
  rotate: [15, 0],
  delay: stagger(45),
  duration: 620,
  loop: true,
  alternate: true,
  loopDelay: 500,
  ease: 'out(3)',
});
</script>
</body>
</html>
