<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facets — Animation Primitive Library</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #12121a;
    --panel-2: #151520;
    --line: #1f1f2e;
    --text: #e8e8f0;
    --muted: #8a8aa0;
    --dim: #6a6a85;
    --mint: #7ef2c3;
    --cyan: #8fdfff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { padding: 40px 24px 80px; }
  header, .toolbar, .family, .status { max-width: 1180px; margin-left: auto; margin-right: auto; }
  header { margin-bottom: 24px; display: grid; gap: 10px; }
  .eyebrow { color: var(--mint); font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 52px); color: #e0f4ff; letter-spacing: 0.5px; line-height: 1; }
  header p { max-width: 820px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
  a { color: var(--mint); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .toolbar { position: sticky; top: 0; z-index: 5; margin-bottom: 22px; padding: 14px; background: color-mix(in oklab, var(--bg) 86%, black); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(14px); }
  .filter-toggle { display: none; width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; align-items: center; justify-content: space-between; gap: 12px; }
  .filter-toggle .label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .filter-toggle .eyebrow-small { color: var(--dim); font-size: 9px; letter-spacing: 1.3px; text-transform: uppercase; }
  .filter-toggle .active-filter { color: var(--mint); font-size: 12px; }
  .filter-toggle .chevron { color: var(--dim); transition: transform .18s ease; }
  .toolbar.expanded .filter-toggle .chevron { transform: rotate(180deg); }
  .toolbar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  button.chip { min-height: 34px; border: 1px solid var(--line); border-radius: 999px; padding: 0 12px; background: var(--panel); color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; }
  button.chip:hover, button.chip.active { color: var(--bg); background: var(--mint); border-color: var(--mint); }
  .counts { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .family { margin-top: 28px; }
  .family-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .family h2 { margin: 0; color: var(--cyan); font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; }
  .family .hint { color: var(--dim); font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 420px; opacity: 0; transform: translateY(16px); }
  .card iframe { width: 100%; aspect-ratio: 1 / 1; border: 0; display: block; background: var(--bg); }
  .card .meta { padding: 14px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h3 { margin: 0; font-size: 15px; color: #e0f4ff; font-weight: 700; }
  .card .id { font-size: 10px; color: var(--dim); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; color: var(--dim); font-size: 9px; text-transform: uppercase; letter-spacing: .7px; }
  .badge.tier { color: var(--mint); border-color: color-mix(in oklab, var(--mint) 42%, var(--line)); }
  .card p { margin: 0; font-size: 12px; line-height: 1.5; color: #a0a0b8; }
  .card .footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .8px; }
  .hidden { display: none; }
  .status { color: var(--dim); font-size: 12px; padding: 18px 0; }
  @media (max-width: 680px) {
    body { padding: 16px 12px 72px; }
    header { margin-bottom: 14px; }
    .toolbar { top: 8px; margin-bottom: 14px; padding: 10px; border-radius: 12px; }
    .filter-toggle { display: flex; }
    .toolbar-panel { display: none; margin-top: 10px; max-height: min(46vh, 430px); overflow: auto; padding-right: 2px; }
    .toolbar.expanded .toolbar-panel { display: block; }
    .toolbar-row { align-items: flex-start; gap: 10px; }
    .chips { gap: 8px; }
    button.chip { min-height: 40px; padding: 0 14px; font-size: 12px; }
    .counts { width: 100%; padding: 4px 2px 0; }
    .family { margin-top: 18px; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .card { min-height: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .card { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Diamond Legendz Facets Laboratory</div>
  <h1>Facets</h1>
  <p>Minimal anime.js v4 sketches. One idea per file, then combinations as they earn promotion. The gallery stays visible on purpose: multiple loops side by side make shared flavor and drift obvious. <a href="../index.html">← back to Diamondlegendz</a></p>
</header>

<section class="toolbar" id="filterToolbar" aria-label="Facet filters">
  <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterPanel">
    <span class="label"><span class="eyebrow-small">Filters</span><span class="active-filter" id="activeFilterLabel">all</span></span>
    <span class="chevron" aria-hidden="true">⌄</span>
  </button>
  <div class="toolbar-panel" id="filterPanel">
    <div class="toolbar-row">
      <div class="chips" id="chips"></div>
      <div class="counts" id="counts">loading facets</div>
    </div>
  </div>
</section>

<main id="gallery" class="status">Loading manifest...</main>

<script type="module">
import { animate, stagger } from './vendor/anime.esm.min.js';

const FAMILY_ORDER = [
  'foundations',
  'stagger and values',
  'timeline and clocks',
  'svg',
  'interaction',
  'physics and easing',
  'text',
  'plumbing and utilities',
  'other',
];

const gallery = document.getElementById('gallery');
const toolbar = document.getElementById('filterToolbar');
const filterToggle = document.getElementById('filterToggle');
const activeFilterLabel = document.getElementById('activeFilterLabel');
const chips = document.getElementById('chips');
const counts = document.getElementById('counts');
const mobileFilters = window.matchMedia('(max-width: 680px)');
let active = 'all';
let facets = [];

const familyFor = facet => {
  const id = facet.id.toLowerCase();
  if (['translate-basic', 'rotate-basic', 'scale-basic', 'skew-basic', 'opacity-basic', 'color-basic', 'keyframes-basic', 'relative-values'].includes(id)) return 'foundations';
  if (id.startsWith('stagger-') || id === 'function-values') return 'stagger and values';
  if (id.includes('timeline') || id.includes('timer')) return 'timeline and clocks';
  if (id.startsWith('svg-')) return 'svg';
  if (id.includes('drag') || id.includes('scroll') || id.includes('animatable')) return 'interaction';
  if (id.includes('spring') || id.includes('easing')) return 'physics and easing';
  if (id.includes('splittext') || id.includes('text')) return 'text';
  if (id.includes('scope') || id.includes('utils') || id.includes('waapi')) return 'plumbing and utilities';
  return 'other';
};

const unique = values => [...new Set(values)].sort((a, b) => a.localeCompare(b));

const labelFor = value => {
  if (value === 'all') return 'all';
  if (value.startsWith('tier:')) return `tier ${value.slice(5)}`;
  if (value.startsWith('api:')) return value.slice(4);
  return value;
};

function setToolbarExpanded(expanded) {
  toolbar.classList.toggle('expanded', expanded);
  filterToggle.setAttribute('aria-expanded', String(expanded));
}

filterToggle.addEventListener('click', () => {
  setToolbarExpanded(!toolbar.classList.contains('expanded'));
});

mobileFilters.addEventListener('change', event => {
  if (!event.matches) setToolbarExpanded(false);
});

async function loadManifest() {
  const response = await fetch('manifest.json', { cache: 'no-store' });
  if (!response.ok) throw new Error(`manifest ${response.status}`);
  return response.json();
}

function renderChips() {
  const apis = unique(facets.flatMap(f => f.apis || []));
  const chipData = [
    ['all', 'all'],
    ['tier:0', 'tier 0'],
    ['tier:1', 'tier 1'],
    ...apis.map(api => [`api:${api}`, api]),
  ];
  activeFilterLabel.textContent = labelFor(active);
  chips.innerHTML = '';
  for (const [value, label] of chipData) {
    const button = document.createElement('button');
    button.className = `chip ${value === active ? 'active' : ''}`;
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => {
      active = value;
      render();
      if (mobileFilters.matches) setToolbarExpanded(false);
    });
    chips.appendChild(button);
  }
}

function passes(facet) {
  if (active === 'all') return true;
  if (active.startsWith('tier:')) return facet.tier === Number(active.split(':')[1]);
  if (active.startsWith('api:')) return (facet.apis || []).includes(active.slice(4));
  return true;
}

function card(facet) {
  const article = document.createElement('article');
  article.className = 'card';
  article.dataset.id = facet.id;
  const apis = (facet.apis || []).slice(0, 3).map(api => `<span class="badge">${api}</span>`).join('');
  article.innerHTML = `
    <iframe src="${facet.url}" loading="lazy" title="${facet.id}"></iframe>
    <div class="meta">
      <div class="row">
        <div><h3>${facet.title}</h3><div class="id">${facet.id}</div></div>
        <span class="badge tier">tier ${facet.tier}</span>
      </div>
      <p>${facet.description}</p>
      <div class="badges">${apis}</div>
      <div class="footer"><span>${facet.loc || '?'} lines</span><a href="${facet.url}" target="_blank">open stage →</a></div>
    </div>`;
  return article;
}

function render() {
  renderChips();
  const visible = facets.filter(passes);
  counts.textContent = `${visible.length} showing / ${facets.length} total`;
  gallery.className = '';
  gallery.innerHTML = '';
  const byFamily = new Map();
  for (const facet of visible) {
    const family = familyFor(facet);
    if (!byFamily.has(family)) byFamily.set(family, []);
    byFamily.get(family).push(facet);
  }
  for (const family of FAMILY_ORDER) {
    const group = byFamily.get(family);
    if (!group || !group.length) continue;
    const section = document.createElement('section');
    section.className = 'family';
    section.innerHTML = `<div class="family-head"><h2>${family}</h2><span class="hint">${group.length} facets</span></div><div class="grid"></div>`;
    const grid = section.querySelector('.grid');
    for (const facet of group) grid.appendChild(card(facet));
    gallery.appendChild(section);
  }
  if (!visible.length) gallery.innerHTML = '<div class="status">No facets match this filter.</div>';
  animate('.card', {
    opacity: [0, 1],
    y: [16, 0],
    duration: 500,
    delay: stagger(35),
    ease: 'out(3)',
  });
}

try {
  facets = await loadManifest();
  render();
} catch (error) {
  gallery.className = 'status';
  gallery.textContent = `Could not load facets manifest: ${error.message}`;
}
</script>
</body>
</html>
