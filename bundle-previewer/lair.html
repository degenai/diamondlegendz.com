<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' https://cards.scryfall.io https://archives.bulbagarden.net https://images.pokemontcg.io https://en.ws-tcg.com https://storage.googleapis.com data:;">
<title>Discrete Lair · BBL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000080'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='%23FFFF00' font-family='monospace'%3E%E2%9C%82%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    background-image: url('../assets/bg.gif');
    color: #FFFF00;
    font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
    margin: 0;
    padding: 20px 0;
  }
  a { color: #00FFFF; text-decoration: none; }
  a:hover { color: #FF00FF; text-decoration: underline; background-color: white; }

  .container {
    width: 95%;
    max-width: 1100px;
    margin: 0 auto;
    background-color: rgba(0, 0, 128, 0.88);
    border: 10px ridge #FF0000;
    padding: 24px;
  }

  /* HERO */
  .hero { text-align: center; padding: 16px 8px 24px; border-bottom: 3px dashed #00FFFF; margin-bottom: 24px; }
  .catalog-line {
    color: #AAA; font-size: 0.85em; letter-spacing: 0.2em;
    text-transform: uppercase; margin: 0 0 6px;
  }
  .catalog-line .series-label { color: #FF00FF; }
  .catalog-line .catalog-id { color: #00FFFF; }
  .hub-badges {
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .hub-badge {
    background: #FF00FF; color: #FFFF00;
    border: 2px outset #FFFF00;
    padding: 4px 12px; font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.1em;
    box-shadow: 2px 2px 0 #000;
  }
  .title {
    font-size: 3.2em; line-height: 1.05;
    color: #FFFF00; text-shadow: 4px 4px 0 #FF0000, 8px 8px 0 #000;
    margin: 8px 0 4px; font-weight: bold;
  }
  .title .char { display: inline-block; }
  .subtitle {
    font-size: 1.2em; color: #00FFFF; font-style: italic;
    margin: 0 0 18px;
  }
  .narrative {
    color: #FFFFFF; font-size: 1.05em; line-height: 1.55;
    max-width: 780px; margin: 0 auto;
    text-align: left;
    background: rgba(0, 0, 0, 0.35); padding: 14px 18px; border-left: 4px solid #FF00FF;
  }

  /* ANCHOR TAGS */
  .anchors-row {
    text-align: center; margin: 18px 0;
  }
  .anchors-label { color: #00FFFF; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 6px; }
  .anchor-tag {
    display: inline-block; margin: 3px 4px;
    background: #00FF00; color: #000080;
    border: 2px outset #FFFFFF;
    padding: 3px 10px; font-size: 0.95em; font-weight: bold;
  }

  /* ART CAROUSEL */
  .art-carousel-section {
    margin: 22px 0;
    border-top: 2px dashed #FF00FF;
    border-bottom: 2px dashed #FF00FF;
    padding: 10px 0;
    background: rgba(0, 0, 0, 0.45);
  }
  .art-carousel-label {
    color: #FF00FF; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.18em;
    text-align: center; margin: 0 0 8px;
  }
  .art-carousel-sub {
    color: #AAA; font-size: 0.85em; letter-spacing: 0.1em; text-transform: none; font-style: italic;
  }
  .art-carousel {
    overflow: hidden;
    width: 100%;
    height: 220px;
    position: relative;
    padding: 6px 0;  /* breathing room so drop-shadow + ridge don't clip */
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;  /* allow vertical page scroll, capture horizontal */
  }
  .art-carousel.is-dragging { cursor: grabbing; }
  .art-carousel-track {
    display: flex;
    gap: 16px;
    height: 100%;
    width: max-content;
    will-change: transform;
    align-items: center;
  }
  .art-carousel-slide img { pointer-events: none; -webkit-user-drag: none; }

  /* LIGHTBOX */
  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0, 0, 0, 0.92);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    padding: 32px;
    cursor: zoom-out;
    animation: lightbox-fade-in 0.25s ease;
  }
  @keyframes lightbox-fade-in {
    from { opacity: 0; } to { opacity: 1; }
  }
  .lightbox-image {
    max-width: min(95vw, 1400px);
    max-height: 80vh;
    border: 4px ridge #FFFF00;
    box-shadow: 0 0 32px rgba(255, 0, 255, 0.5),
                0 0 60px rgba(255, 255, 0, 0.25);
    background: #111;
    display: block;
  }
  .lightbox-caption {
    color: #FFFF00; text-align: center;
    font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
    text-shadow: 2px 2px 0 #000;
  }
  .lightbox-caption .lb-name {
    font-size: 1.5em; font-weight: bold; display: block; margin-bottom: 4px;
  }
  .lightbox-caption .lb-artist { color: #00FFFF; font-style: italic; }
  .lightbox-caption .lb-meta { color: #AAA; font-size: 0.85em; margin-top: 6px; display: block; }
  .lightbox-close {
    position: absolute; top: 18px; right: 24px;
    background: #FF00FF; color: #FFFF00;
    border: 3px outset #FFFF00;
    font-family: inherit; font-size: 1.4em; font-weight: bold;
    width: 44px; height: 44px;
    cursor: pointer; line-height: 1;
    box-shadow: 3px 3px 0 #000;
  }
  .lightbox-close:hover { background: #FFFF00; color: #FF00FF; }
  .art-carousel-slide {
    flex: 0 0 auto;
    height: 100%;
    aspect-ratio: 626 / 457;
    border: 3px ridge #FFFF00;
    background: #111;
    overflow: hidden;
    position: relative;
    box-sizing: border-box;  /* keep border inside the height allocation */
    box-shadow:
      4px 4px 0 #000,
      0 0 14px rgba(255, 0, 255, 0.45);
    transition: transform 0.22s ease, box-shadow 0.22s ease,
                border-color 0.22s ease, filter 0.22s ease;
    cursor: pointer;
    filter: saturate(0.92);
  }
  .art-carousel-slide:hover,
  .art-carousel-slide:focus-visible {
    transform: translateY(-6px) scale(1.04);
    border-color: #FF00FF;
    box-shadow:
      6px 8px 0 #000,
      0 0 22px rgba(255, 255, 0, 0.6),
      0 0 30px rgba(255, 0, 255, 0.45);
    filter: saturate(1.15) brightness(1.06);
    z-index: 3;
  }
  .art-carousel-slide:active {
    transform: translateY(-2px) scale(1.02);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .art-carousel-slide img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .art-carousel-slide .slide-caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 30%, rgba(0,0,0,0));
    color: #FFFF00; font-size: 0.8em;
    padding: 22px 10px 8px; text-align: left;
    text-shadow: 1px 1px 0 #000;
    pointer-events: none;
  }
  .art-carousel-slide .slide-caption .slide-name { font-weight: bold; display: block; }
  .art-carousel-slide .slide-caption .slide-artist { color: #00FFFF; font-style: italic; font-size: 0.9em; }

  /* MICHI BINDER PAGES — multi-page 3x3 grids. 5 cards + up to 4 fan-art
     inserts (1x1 or 1x2 horizontal panels per real Michi practice). All
     unique cards in the bundle distributed across pages. No labels: only
     cards and art. Pages styled like real binder leaves: vinyl pocket
     sheen, ring-hole gutter on the left edge. */
  .michi-section { margin: 28px 0; }
  .michi-section-label {
    color: #FF00FF; font-size: 0.85em; text-transform: uppercase;
    letter-spacing: 0.2em; text-align: center; margin: 0 0 14px;
  }
  .michi-section-label .michi-section-sub {
    color: #AAA; font-style: italic; text-transform: none; letter-spacing: 0.05em;
    font-size: 0.95em;
  }
  .michi-pages {
    display: flex;
    flex-direction: column;
    gap: 36px;
    align-items: center;
  }
  .michi-page {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-flow: dense;  /* backfill single-card slots around wide art */
    gap: 12px;
    width: 100%;
    max-width: 880px;
    background:
      /* faint diagonal vinyl-pocket sheen */
      linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.05) 100%),
      linear-gradient(180deg, #0a0a14 0%, #08080f 100%);
    padding: 22px 22px 22px 56px;  /* extra left padding for the ring-hole gutter */
    border: 4px ridge #FFD700;
    border-radius: 3px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      6px 6px 0 #000,
      0 12px 30px rgba(0,0,0,0.55),
      inset 0 0 60px rgba(255, 0, 255, 0.06);
    position: relative;
  }
  /* Ring-hole gutter: three reinforced holes down the left edge. */
  .michi-page::before {
    content: '';
    position: absolute;
    left: 14px; top: 14%; bottom: 14%;
    width: 28px;
    background:
      radial-gradient(circle at 50% 12%, #000 0 6px, rgba(0,0,0,0.55) 6px 9px, transparent 10px),
      radial-gradient(circle at 50% 50%, #000 0 6px, rgba(0,0,0,0.55) 6px 9px, transparent 10px),
      radial-gradient(circle at 50% 88%, #000 0 6px, rgba(0,0,0,0.55) 6px 9px, transparent 10px);
    pointer-events: none;
  }
  .michi-page-number {
    position: absolute;
    right: 14px; bottom: 8px;
    color: rgba(255, 215, 0, 0.55);
    font-family: "Courier New", monospace; font-size: 0.7em;
    letter-spacing: 0.15em; text-transform: uppercase;
    pointer-events: none;
  }
  .michi-slot {
    aspect-ratio: 63 / 88;  /* TCG card proportion = single-slot baseline */
    background:
      linear-gradient(135deg, #1a1a1a, #050505);
    border: 1px solid rgba(255, 215, 0, 0.35);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.6),
      0 2px 4px rgba(0,0,0,0.5);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, z-index 0s linear 0s;
  }
  .michi-slot.is-clickable { cursor: zoom-in; }
  .michi-slot:hover {
    transform: translateY(-3px) scale(1.025);
    border-color: #FFFF00;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.6),
      0 6px 14px rgba(0,0,0,0.7),
      0 0 18px rgba(255, 0, 255, 0.4);
    z-index: 2;
  }
  /* Vinyl-pocket gloss: faint diagonal highlight across each slot. */
  .michi-slot::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(120deg,
      rgba(255,255,255,0) 30%,
      rgba(255,255,255,0.07) 45%,
      rgba(255,255,255,0.13) 50%,
      rgba(255,255,255,0.07) 55%,
      rgba(255,255,255,0) 70%);
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .michi-slot img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .michi-slot.art-wide {
    grid-column: span 2;
    aspect-ratio: 126 / 88;   /* double width, same height as 1-slot */
  }
  /* Art inserts: distinguish from cards visually so the curation reads as
     intentional composition rather than "card with weird crop." */
  .michi-slot.art-wide,
  .michi-slot.art-single {
    border-color: rgba(255, 0, 255, 0.45);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.6),
      inset 0 0 30px rgba(255, 0, 255, 0.08),
      0 2px 6px rgba(0,0,0,0.5);
  }
  .michi-slot.art-wide img,
  .michi-slot.art-single img {
    object-fit: cover;  /* fill the slot; meta panel-dimensions chose orientation */
    object-position: center 25%;  /* prefer faces/upper subjects when cropping portraits */
  }

  /* Museum-wall credit label, revealed on hover/focus. Tiny by design —
     reads as exhibition signage, not as a UI tooltip. */
  .michi-slot .credit {
    position: absolute; left: 6px; right: 6px; bottom: 6px;
    background: rgba(0, 0, 0, 0.78);
    color: #FFFF99;
    font-family: "Courier New", monospace;
    font-size: 0.62em; line-height: 1.25;
    letter-spacing: 0.04em;
    padding: 4px 6px;
    border-left: 2px solid #FF00FF;
    opacity: 0; transform: translateY(4px);
    transition: opacity 0.18s ease, transform 0.18s ease;
    pointer-events: none;
  }
  .michi-slot:hover .credit,
  .michi-slot:focus-within .credit {
    opacity: 1; transform: translateY(0);
  }
  .michi-slot .credit .credit-name {
    color: #FFFFFF; font-weight: bold; display: block;
  }
  .michi-slot .credit .credit-source {
    color: #00FFFF; font-style: italic;
  }

  /* Headliner ring: slot containing the bundle's most-expensive card gets
     a constant low-key magenta glow so the eye lands on it first without
     interrupting the museum tone. */
  .michi-slot.is-headliner {
    border-color: #FF00FF;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.6),
      0 0 0 2px rgba(255, 0, 255, 0.5),
      0 0 22px rgba(255, 0, 255, 0.5),
      0 2px 6px rgba(0,0,0,0.5);
  }
  .michi-slot.is-headliner::before {
    content: 'headliner';
    position: absolute; top: 6px; left: 6px;
    background: #FF00FF; color: #FFFF00;
    font-family: "Courier New", monospace;
    font-size: 0.55em; font-weight: bold;
    letter-spacing: 0.15em; text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid #FFFF00;
    box-shadow: 1px 1px 0 #000;
    z-index: 2;
    pointer-events: none;
  }

  /* CARD GRID */
  .grid-section-label {
    color: #00FFFF; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.15em;
    text-align: center; margin: 28px 0 12px;
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    margin: 0 0 24px;
  }
  .card-tile {
    background: #FFFAF0; color: #000;
    border: 4px ridge #FFFF00;
    padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    transform-origin: center;
  }
  .card-tile img {
    width: 100%; aspect-ratio: 488 / 680; object-fit: cover;
    background: #DDD;
    border: 2px solid #000;
    display: block;
  }
  .card-name { font-size: 1.15em; font-weight: bold; color: #800000; margin: 0; }
  .card-meta { font-size: 0.85em; color: #444; font-style: italic; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .card-tag {
    background: #FFFF00; color: #000; font-size: 0.75em;
    padding: 1px 6px; border: 1px solid #800000;
  }
  .why-it-fits {
    background: #FFE4E1; border-left: 3px solid #FF0000;
    padding: 8px 10px; font-size: 0.9em; color: #200;
    line-height: 1.45; margin-top: 4px;
  }
  .qty-pill {
    align-self: flex-start;
    background: #000080; color: #FFFF00;
    font-size: 0.75em; padding: 2px 8px;
    border: 1px solid #FFFF00;
  }

  /* COHESION PANEL */
  .cohesion {
    background: rgba(0, 0, 0, 0.4); border: 2px dashed #00FFFF;
    padding: 16px 20px; margin-top: 24px;
  }
  .cohesion h3 {
    color: #FF00FF; font-size: 1.1em; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.1em;
  }
  .cohesion-row { display: flex; align-items: center; gap: 12px; margin: 6px 0; flex-wrap: wrap; }
  .cohesion-label { color: #00FFFF; min-width: 80px; font-size: 0.9em; }
  .cohesion-value { color: #FFFFFF; font-size: 0.95em; }
  .palette { display: inline-flex; gap: 4px; }
  .swatch {
    width: 28px; height: 28px; border: 2px solid #FFFFFF;
    display: inline-block;
  }

  /* CHECKOUT BUTTON */
  .checkout-row {
    margin-top: 14px; padding-top: 14px;
    border-top: 2px dotted #00FF00;
    text-align: center;
  }
  .buy-button {
    display: inline-block;
    background: #00FF00; color: #000080;
    font-family: inherit; font-size: 1.25em; font-weight: bold;
    text-transform: uppercase; letter-spacing: 0.1em;
    padding: 12px 32px;
    border: 3px outset #FFFF00;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 4px 4px 0 #000;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .buy-button:hover {
    background: #FFFF00;
    color: #000080;
    text-decoration: none;
    transform: translate(-1px, -1px);
    box-shadow: 5px 5px 0 #000;
  }
  .buy-button:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #000;
  }
  .buy-button-disabled {
    display: inline-block;
    background: #444; color: #888;
    font-family: inherit; font-size: 1em;
    padding: 10px 24px;
    border: 2px solid #666;
    cursor: not-allowed;
  }
  .checkout-meta {
    margin-top: 8px; color: #AAA; font-size: 0.85em; font-style: italic;
  }
  .checkout-secured {
    margin-top: 4px; color: #00FFFF; font-size: 0.8em;
  }

  /* PRICING */
  .pricing {
    background: rgba(0, 0, 0, 0.5); border: 3px ridge #00FF00;
    padding: 16px 20px; margin-top: 22px;
  }
  .pricing h3 {
    color: #00FF00; font-size: 1.15em; margin: 0 0 12px;
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .receipt {
    font-family: "Courier New", "Lucida Console", monospace;
    font-size: 0.95em;
  }
  .receipt-section {
    color: #00FFFF; font-size: 0.78em; text-transform: uppercase;
    letter-spacing: 0.18em; margin: 10px 0 4px;
  }
  .receipt-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 3px 0; color: #FFFFFF; gap: 12px;
  }
  .receipt-row.subtle { color: #AAA; font-size: 0.88em; padding-left: 14px; }
  .receipt-row.subtotal { color: #FFFFFF; padding-top: 5px; border-top: 1px dotted #555; margin-top: 2px; }
  .receipt-row.headline {
    color: #FFFF00; font-weight: bold; font-size: 1.18em;
    padding: 10px 0;
    border-top: 2px solid #FFFF00; border-bottom: 2px solid #FFFF00;
    margin: 10px 0;
  }
  .receipt-row.savings { color: #00FF00; font-weight: bold; }
  .receipt-label { flex: 1; }
  .receipt-value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pricing-justification {
    margin-top: 12px; padding: 10px 12px;
    background: rgba(255, 0, 255, 0.12); border-left: 3px solid #FF00FF;
    color: #FFE4FF; font-size: 0.92em; font-style: italic; line-height: 1.5;
  }
  .pricing-shipping-note {
    margin-top: 8px; color: #FFFF00; font-size: 0.85em; text-align: right; font-style: italic;
  }

  /* METADATA */
  .metadata {
    margin-top: 18px; padding: 10px 14px;
    background: rgba(0, 0, 0, 0.25); border-top: 2px dotted #FFFF00;
    font-size: 0.85em; color: #AAA;
  }
  .metadata strong { color: #FFFF00; }

  /* LOAD CONTROLS */
  .load-controls {
    text-align: center; margin: 0 0 20px; padding: 8px 0;
    border-bottom: 1px dotted #00FFFF;
  }
  .load-controls label {
    color: #00FFFF; font-size: 0.9em; margin-right: 8px;
  }
  .load-controls input[type="file"] {
    color: #FFFF00; background: #000080; border: 2px ridge #FFFF00; padding: 4px;
    font-family: inherit; font-size: 0.9em;
  }
  .error {
    color: #FF8888; background: rgba(80,0,0,0.5); padding: 8px 12px;
    border: 2px solid #FF0000; margin: 12px 0;
  }

  /* CONSTELLATION — bundle-scoped graph of curatorial connections.
     Renderer in constellation.js. Data comes from bundle.connections.
     Cards in inner ring, external resonance nodes in outer ring, edges
     color-coded by kind. */
  .constellation-section {
    margin: 28px 0;
    padding: 18px 14px 14px;
    background: rgba(0, 0, 0, 0.55);
    border: 2px ridge #FF00FF;
    border-radius: 3px;
    position: relative;
  }
  .constellation-label {
    color: #FF00FF; font-size: 0.85em; text-transform: uppercase;
    letter-spacing: 0.2em; text-align: center; margin: 0 0 8px;
  }
  .constellation-label .constellation-sub {
    color: #AAA; font-style: italic; text-transform: none;
    letter-spacing: 0.04em; font-size: 0.95em;
  }
  .constellation-svg {
    display: block; width: 100%; height: auto;
    max-width: 900px; margin: 0 auto;
    background:
      radial-gradient(ellipse at center, rgba(80, 0, 80, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
  }
  .constellation-svg .node { cursor: pointer; transition: opacity 0.18s ease; }
  .constellation-svg .node circle { transition: stroke 0.18s ease, filter 0.18s ease; }
  .constellation-svg .node.dim { opacity: 0.22; }
  .constellation-svg .node.focus circle {
    filter: drop-shadow(0 0 6px rgba(255, 0, 255, 0.85));
    stroke: #FFFF00; stroke-width: 3;
  }
  .constellation-svg .node-label {
    pointer-events: none;
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  }
  .constellation-svg .edge { cursor: pointer; transition: stroke-opacity 0.15s, stroke-width 0.15s; }
  .constellation-svg .edge.dim { stroke-opacity: 0.12 !important; }
  .constellation-svg .edge.active { stroke-opacity: 0.95 !important; }
  /* Bridge edges = touching a multi-card external (e.g. shared artist) get
     a subtle outer glow so the curatorial spine reads first. */
  .constellation-svg .edge-bridge { filter: drop-shadow(0 0 3px currentColor); }
  .constellation-svg .node.is-bridge circle:not(:first-of-type) {
    stroke: #FFFFFF; stroke-width: 2.5;
    filter: drop-shadow(0 0 4px currentColor);
  }
  .constellation-svg .node.is-bridge .node-label { font-weight: bold; }
  .constellation-svg .node.dragging { cursor: grabbing; }
  .constellation-svg .node.dragging circle:not(:first-of-type) {
    filter: drop-shadow(0 0 8px rgba(255, 255, 0, 0.9));
  }

  .constellation-featured-artists {
    max-width: 900px; margin: 0 auto 10px;
    text-align: center;
    font-family: "Courier New", monospace; font-size: 0.78em;
    color: #DDD;
    padding: 6px 12px;
  }
  .constellation-featured-artists .featured-title {
    color: #00FFFF; text-transform: uppercase; letter-spacing: 0.15em;

  }
  .constellation-featured-artists .featured-artist {
    color: #FFFFFF;
  }
  .constellation-featured-artists .featured-artist.multi {
    color: #FFFF00; font-weight: bold;
    text-shadow: 0 0 6px rgba(255, 255, 0, 0.6);
  }
  .constellation-featured-artists .featured-sep { color: #555; }

  .constellation-tip {
    position: absolute;
    background: rgba(0, 0, 0, 0.92);
    color: #FFFF99;
    border: 1px solid #FF00FF;
    border-left-width: 3px;
    padding: 8px 12px;
    font-family: "Courier New", monospace;
    font-size: 0.78em; line-height: 1.4;
    max-width: 260px;
    pointer-events: none;
    z-index: 5;
    box-shadow: 3px 3px 0 #000;
  }
  .constellation-tip strong { color: #FFFFFF; }
  .constellation-tip .tip-kind { color: #00FFFF; font-style: italic; }
  .constellation-tip .tip-note { color: #FFFFFF; font-style: italic; opacity: 0.8; }

  .constellation-legend {
    margin: 14px auto 0;
    max-width: 900px;
    display: flex; flex-wrap: wrap; gap: 18px;
    padding: 10px 12px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px dashed #00FFFF;
    font-family: "Courier New", monospace; font-size: 0.72em;
  }
  .constellation-legend .legend-section { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .constellation-legend .legend-title {
    color: #00FFFF; text-transform: uppercase; letter-spacing: 0.15em;
    margin-right: 6px;
  }
  .constellation-legend .legend-item { display: inline-flex; align-items: center; gap: 5px; color: #FFF; }
  .constellation-legend .legend-dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
    border: 1px solid #000;
  }
  .constellation-legend .legend-line {
    width: 18px; height: 2px; display: inline-block;
  }
  .constellation-legend .legend-name { color: #DDD; }

  @media (max-width: 600px) {
    .constellation-section { padding: 12px 6px; }
    .constellation-legend { font-size: 0.65em; gap: 10px; padding: 8px; }
  }

  /* FOOTER NAV */
  .footer-nav { text-align: center; margin-top: 22px; padding: 12px 0 4px; border-top: 1px solid #00FFFF; }
  .footer-nav a { font-size: 0.9em; }

  @media (max-width: 600px) {
    .title {
      font-size: 2.2em;
      /* Reduce text-shadow stack so it doesn't push past the container border on narrow screens */
      text-shadow: 2px 2px 0 #FF0000, 4px 4px 0 #000;
    }
    .container { padding: 14px; border-width: 6px; }
    .hero { overflow: hidden; }  /* belt: clip any residual title-shadow bleed */

    /* Binder pages: drop the ring-hole gutter and tighten spacing — the
       3x3 grid stays intact, but the cards regain breathing room that
       the 56px left padding was eating at narrow widths. */
    .michi-page { padding: 12px; gap: 8px; border-width: 3px; }
    .michi-page::before { display: none; }
    .michi-slot { border-radius: 3px; }
    .michi-slot.is-headliner::before {

    }
    .michi-section-label { font-size: 0.75em; }
    .michi-section-label .michi-section-sub { display: block; margin-top: 2px; }
    .michi-pages { gap: 22px; }
  }
</style>
