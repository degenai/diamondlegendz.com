<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facet — WAAPI Basic</title>
<!--
facet:
  id: waapi-basic
  tier: 0
  title: WAAPI Basic
  description: Hardware-backed WAAPI animation through waapi.animate.
  tags: [waapi, hardware]
  apis: [waapi.animate, stagger]
  parents: []
-->
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0f; font-family: ui-monospace, monospace; color: #e8e8f0; }
body { display: grid; place-items: center; }
#stage { width: min(90vw, 600px); aspect-ratio: 1 / 1; display: grid; place-items: center; position: relative; }

#stage { justify-items: start; padding-left: 120px; box-sizing: border-box; gap: 16px; }
.chip { width: 58px; height: 28px; border: 1px solid #7ef2c3; background: #101820; box-shadow: 0 0 18px rgba(126, 242, 195, .2); }
</style>
</head>
<body>
<div id="stage">
  <div class="chip"></div>
  <div class="chip"></div>
  <div class="chip"></div>
</div>
<script type="module">
import { waapi, stagger } from '../../../vendor/anime.esm.min.js';

waapi.animate('.chip', {
  translate: '120px 0',
  rotate: '1turn',
  delay: stagger(120),
  duration: 900,
  loop: true,
  alternate: true,
  ease: 'inOut(2)',
});
</script>
</body>
</html>
